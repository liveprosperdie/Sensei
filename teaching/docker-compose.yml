version: "3.8"

services:
  studyroom:
    build: .
    container_name: studyroom-web
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TEACHING_SECRET_KEY=${TEACHING_SECRET_KEY:-}
    volumes:
      - studyroom_data:/app/data
    restart: unless-stopped

volumes:
  studyroom_data:

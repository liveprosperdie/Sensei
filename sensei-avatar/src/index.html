<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akira</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="speech-bubble" role="status" aria-live="polite"></div>
      <div id="avatar-container" data-tauri-drag-region>
        <div id="lean">
          <div id="avatar-wrap">
            <img id="avatar" src="assets/akira.png" alt="Akira" draggable="false" />
            <span class="pupil" id="pupil-left" aria-hidden="true"></span>
            <span class="pupil" id="pupil-right" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div id="particles" aria-hidden="true"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
